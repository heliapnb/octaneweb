<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCTANE Decision Support Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .step-inactive { display: none; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-700 text-white p-2 rounded-lg shadow-md">
                    <i class="fas fa-microscope text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-slate-800 leading-none">OCTANE <span class="text-blue-600">DECISION SUPPORT TOOL</span></h1>
                    <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-1">CCO Eligibility • Germline Confirmation</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <nav class="flex border-b border-slate-200 mb-8 bg-white rounded-t-2xl px-2 shadow-sm overflow-x-auto">
            <button onclick="switchTab('eligibility')" id="tab-eligibility" class="whitespace-nowrap px-8 py-5 font-bold tab-active transition-all outline-none">
                CCO Eligibility Criteria
            </button>
            <button onclick="switchTab('germline')" id="tab-germline" class="whitespace-nowrap px-8 py-5 font-bold text-slate-400 hover:text-blue-600 transition-all outline-none">
                Germline Confirmation DST
            </button>
        </nav>

        <!-- Eligibility Section -->
        <section id="sec-eligibility" class="space-y-6">
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <label class="block text-xs font-black text-slate-400 mb-3 uppercase tracking-widest">Select Patient's Primary Diagnosis</label>
                <div class="relative">
                    <input type="text" id="cancerSearch" placeholder="Search (e.g. Colon, Breast, Melanoma...)" 
                           class="w-full p-4 pl-12 border border-slate-300 rounded-xl focus:ring-4 focus:ring-blue-100 outline-none transition-all text-lg font-medium">
                    <i class="fas fa-search absolute left-4 top-5 text-slate-400"></i>
                </div>
                <div id="searchResults" class="mt-2 border border-slate-200 rounded-xl hidden max-h-64 overflow-y-auto bg-white shadow-2xl z-20 relative custom-scrollbar"></div>
            </div>

            <div id="eligibilityQuestionnaire" class="hidden animate-fade-in bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-6">
                    <h2 id="eligTitle" class="text-2xl font-black text-slate-800"></h2>
                    <button onclick="resetEligibility()" class="text-slate-400 hover:text-red-500 text-xs font-bold uppercase"><i class="fas fa-undo mr-1"></i> Reset</button>
                </div>
                <div id="eligQuestions" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                <div id="eligFinalResult" class="mt-8 p-6 rounded-2xl hidden border-2"></div>
            </div>
        </section>

        <!-- Germline Section -->
        <section id="sec-germline" class="step-inactive space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                <!-- Left: Input + per-variant cards -->
                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <h2 class="text-xl font-black text-slate-800">Enter tumour variant(s) to begin</h2>
                        <p class="text-xs text-slate-400 font-semibold">One or more variants separated by commas.<br>
                            Example: <span class="font-mono">BRCA1 c.5266dupC, CHEK2 c.524dup</span></p>
                        <textarea id="gVariantInput" rows="3" placeholder="GENE c.xxxxx, GENE c.xxxxx, ..."
                            class="w-full p-4 border border-slate-300 rounded-xl outline-none focus:ring-4 focus:ring-blue-100 font-mono font-bold resize-none text-sm"></textarea>
                        <button onclick="lookupAllVariants()" class="w-full py-4 bg-slate-800 text-white rounded-xl font-black uppercase tracking-widest hover:bg-slate-700 transition-all flex items-center justify-center gap-2 text-sm">
                            <i class="fas fa-database"></i> Look Up in ClinVar
                        </button>
                        <button onclick="bypassAllVariants()" class="w-full py-3 bg-white border-2 border-slate-300 text-slate-500 rounded-xl font-black uppercase tracking-widest hover:border-slate-400 hover:text-slate-700 transition-all flex items-center justify-center gap-2 text-xs">
                            <i class="fas fa-forward"></i> Skip — Check Gene Recommendations Only
                        </button>
                    </div>

                    <!-- Per-variant cards (ClinVar results + context questions) -->
                    <div id="gVariantCards" class="hidden space-y-4"></div>
                </div>

                <!-- Right: Summary table + overall recommendation -->
                <div class="lg:col-span-7">
                    <div id="gOutput" class="bg-slate-100 rounded-3xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center p-8 transition-all min-h-[500px]">
                        <div id="gEmptyState" class="text-center text-slate-400">
                            <i class="fas fa-microscope fa-5x mb-6 opacity-20"></i>
                            <p class="text-xl font-bold">Awaiting Lookup</p>
                            <p class="text-sm">Enter variant(s) and look up in ClinVar to begin.</p>
                        </div>
                        <div id="gResultContent" class="hidden w-full animate-fade-in"></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script src="js/eligibility.js"></script>
    <script src="js/germline.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
